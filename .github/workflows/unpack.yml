name: Extract ResolveIQ

on:
  push:
    paths:
      - "ResolveIQ-GitHub-Ready.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ResolveIQ-GitHub-Ready.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm -f ResolveIQ-GitHub-Ready.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ResolveIQ project files" || echo "Nothing to commit"
          git push
